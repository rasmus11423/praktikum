<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praktikakohtade otsing (testkeskkond)</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>Praktikakohtade otsing — testkeskkond</h1>
    <p class="subtitle">Minimalistlik liides otsingu ja filtrite käsitsi testimiseks.</p>
  </header>

  <main>
    <form id="filters">
      <input type="search" id="q" name="q" placeholder="Otsi pealkirja, ettevõtte või kirjelduse järgi…">

      <fieldset>
        <legend>Tasu</legend>
        <label><input type="radio" name="pay_specified" value="" checked> Kõik</label>
        <label><input type="radio" name="pay_specified" value="true"> Tasu märgitud</label>
        <label><input type="radio" name="pay_specified" value="false"> Pole märgitud</label>
      </fieldset>

      <fieldset>
        <legend>Tööaeg</legend>
        <select id="type" name="type">
          <option value="">Kõik</option>
        </select>
      </fieldset>

      <fieldset>
        <legend>Tähtaeg</legend>
        <label>Alates <input type="date" id="deadline_after" name="deadline_after"></label>
        <label>Kuni <input type="date" id="deadline_before" name="deadline_before"></label>
      </fieldset>

      <button type="submit">Otsi</button>
      <button type="button" id="reset">Lähtesta</button>
    </form>

    <p id="status"></p>
    <div id="results"></div>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
