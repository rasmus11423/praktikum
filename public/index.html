<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praktikakohtade otsing (testkeskkond)</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header-top">
    <div>
      <h1>Praktikakohtade otsing — testkeskkond</h1>
      <p class="subtitle">Minimalistlik liides otsingu ja filtrite käsitsi testimiseks.</p>
    </div>
    <a id="authStatus" class="auth-status" href="/profile.html">…</a>
  </header>

  <main>
    <form id="filters" class="search-bar">
      <div class="dropdown">
        <button type="button" id="moreFiltersToggle" class="dropdown-toggle" aria-expanded="false">Filtrid ▾</button>
        <div id="moreFiltersPanel" class="dropdown-panel hidden">
          <fieldset>
            <legend>Tasu</legend>
            <label><input type="radio" name="pay_specified" value="" checked> Kõik</label>
            <label><input type="radio" name="pay_specified" value="true"> Tasu märgitud</label>
            <label><input type="radio" name="pay_specified" value="false"> Pole märgitud</label>
          </fieldset>

          <fieldset>
            <legend>Tööaeg</legend>
            <select id="type" name="type">
              <option value="">Kõik</option>
            </select>
          </fieldset>

          <fieldset>
            <legend>Asukoht</legend>
            <select id="location" name="location">
              <option value="">Kõik</option>
            </select>
          </fieldset>

          <fieldset>
            <legend>Tähtaeg</legend>
            <label>Alates <input type="date" id="deadline_after" name="deadline_after"></label>
            <label>Kuni <input type="date" id="deadline_before" name="deadline_before"></label>
          </fieldset>
        </div>
      </div>

      <input type="search" id="q" name="q" class="search-input" placeholder="Otsi praktikakohti — eesti või inglise keeles…" autocomplete="off">

      <div class="dropdown">
        <button type="button" id="tagFilterToggle" class="dropdown-toggle" aria-expanded="false">
          Sildid<span id="tagFilterCount"></span> ▾
        </button>
        <div id="tagFilterPanel" class="dropdown-panel dropdown-panel-right hidden"></div>
      </div>

      <button type="button" id="saveSearchBtn" class="save-search-btn hidden">☆ Salvesta otsing</button>
    </form>

    <p id="status"></p>

    <div class="row row-header">
      <span class="col-favorite"></span>
      <span class="col-relevance"></span>
      <span class="col-name">Nimi</span>
      <span class="col-company">Ettevõte</span>
      <span class="col-pay">Tasu</span>
      <span class="col-type">Tööaeg</span>
      <span class="col-tags">Sildid</span>
      <span class="col-deadline">Tähtaeg</span>
      <span class="col-description">Kirjeldus</span>
      <span class="col-link"></span>
    </div>
    <div id="results"></div>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
